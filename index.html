*{

.muted{

color:#fff;

overflow:hidden
}

.menu-button:after{
content:"›";

font-weight:300;
margin-left:auto
}

.menu-daily{

.menu-online{

.share{

}

.mode{

.connection{

font-size:12px;

}

.online{
color:#4ade80
}

.offline{
color:#ff7b86
}

.code-display{
font-size:30px;
letter-spacing:6px;

background:#07162d;
border-radius:14px;

font-size:28px;

text-align:center;
outline:0
}

.secret-help{
font-size:11px;
color:#8295b5;
text-align:center;
margin-top:8px
}
