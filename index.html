<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 40px;
        }

        .card {
            background: #1f2937;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .secondary {
            background: #374151;
        }

        .secondary:hover {
            background: #4b5563;
        }

        .hidden {
            display: none;
        }

        .digits {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
        }

        .digit {
            width: 55px;
            height: 65px;
            background: #111827;
            border: 2px solid #4b5563;
            border-radius: 12px;
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            color: #d1d5db;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .key {
            margin: 0;
            padding: 15px;
            background: #374151;
        }

        .key:hover {
            background: #4b5563;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- TELA INICIAL -->
    <div id="home">

        <div class="logo">🔐 SENHA</div>

        <div class="subtitle">
            Descubra a senha antes do seu adversário.
        </div>

        <div class="card">

            <button onclick="mostrarSenha()">
                JOGAR
            </button>

            <button class="secondary" onclick="alert('Em breve!')">
                JOGAR ONLINE
            </button>

        </div>

    </div>


    <!-- ESCOLHER SENHA -->
    <div id="senhaScreen" class="hidden">

        <div class="logo">🔐</div>

        <div class="subtitle">
            Escolha uma senha com 4 números diferentes.
        </div>

        <div class="card">

            <div class="digits">

                <input class="digit" id="d1" maxlength="1" readonly>
                <input class="digit" id="d2" maxlength="1" readonly>
                <input class="digit" id="d3" maxlength="1" readonly>
                <input class="digit" id="d4" maxlength="1" readonly>

            </div>

            <div class="keyboard">

                <button class="key" onclick="digitar('1')">1</button>
                <button class="key" onclick="digitar('2')">2</button>
                <button class="key" onclick="digitar('3')">3</button>

                <button class="key" onclick="digitar('4')">4</button>
                <button class="key" onclick="digitar('5')">5</button>
                <button class="key" onclick="digitar('6')">6</button>

                <button class="key" onclick="digitar('7')">7</button>
                <button class="key" onclick="digitar('8')">8</button>
                <button class="key" onclick="digitar('9')">9</button>

                <button class="key" onclick="apagar()">⌫</button>
                <button class="key" onclick="digitar('0')">0</button>
                <button class="key" onclick="confirmarSenha()">✓</button>

            </div>

            <div id="mensagem" class="message"></div>

        </div>

    </div>

</div>


<script>

let senha = "";

function mostrarSenha() {

    document.getElementById("home").classList.add("hidden");

    document.getElementById("senhaScreen").classList.remove("hidden");

}

function digitar(numero) {

    if (senha.length >= 4) {
        return;
    }

    if (senha.includes(numero)) {

        document.getElementById("mensagem").innerText =
            "Os números precisam ser diferentes.";

        return;
    }

    senha += numero;

    atualizarTela();

}

function apagar() {

    senha = senha.slice(0, -1);

    atualizarTela();

}

function atualizarTela() {

    document.getElementById("d1").value = senha[0] || "";
    document.getElementById("d2").value = senha[1] || "";
    document.getElementById("d3").value = senha[2] || "";
    document.getElementById("d4").value = senha[3] || "";

    document.getElementById("mensagem").innerText = "";

}

function confirmarSenha() {

    if (senha.length !== 4) {

        document.getElementById("mensagem").innerText =
            "Escolha 4 números.";

        return;
    }

    document.getElementById("mensagem").innerText =
        "Senha criada! 🔒";

}

</script>

</body>
</html>
