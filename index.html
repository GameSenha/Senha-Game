    document
        .getElementById("s1")
        .value = senha[0] || "";

    document
        .getElementById("s2")
        .value = senha[1] || "";

    document
        .getElementById("s3")
        .value = senha[2] || "";

    document
        .getElementById("s4")
        .value = senha[3] || "";


    document
        .getElementById("senhaMensagem")
        .innerText = "";

}


/* ==================================================
   APAGAR SENHA
================================================== */

function apagarSenha() {

    senha = senha.slice(0, -1);

    atualizarSenha();

}


/* ==================================================
   CONFIRMAR SENHA
================================================== */

function confirmarSenha() {

    if (senha.length !== 4) {

        document
            .getElementById("senhaMensagem")
            .innerText =
            "Escolha exatamente 4 números.";

        return;

    }


    iniciarJogo();

}


/* ==================================================
   INICIAR JOGO
================================================== */

function iniciarJogo() {

    clearInterval(intervalo);


    esconderTodas();


    document
        .getElementById("gameScreen")
        .classList
        .remove("hidden");


    chute = "";

    tentativas = 0;

    tempo = 30;


    document
        .getElementById("historico")
        .innerHTML =
        '<p style="color:#9ca3af;text-align:center;">Nenhuma tentativa ainda.</p>';


    atualizarChute();


    iniciarCronometro();

}


/* ==================================================
   DIGITAR CHUTE
================================================== */

function digitarChute(numero) {

    if (chute.length >= 4) {
        return;
    }


    if (chute.includes(numero)) {

        document
            .getElementById("chuteMensagem")
            .innerText =
            "⚠️ Os números precisam ser diferentes.";

        return;

    }


    chute += numero;


    atualizarChute();

}


/* ==================================================
   ATUALIZAR CHUTE
================================================== */

function atualizarChute() {

    document
        .getElementById("g1")
        .innerText = chute[0] || "";

    document
        .getElementById("g2")
        .innerText = chute[1] || "";

    document
        .getElementById("g3")
        .innerText = chute[2] || "";

    document
        .getElementById("g4")
        .innerText = chute[3] || "";


    document
        .getElementById("chuteMensagem")
        .innerText = "";

}


/* ==================================================
   APAGAR CHUTE
================================================== */

function apagarChute() {

    chute = chute.slice(0, -1);

    atualizarChute();

}


/* ==================================================
   CALCULAR RESULTADO
================================================== */

function calcularResultado(senha, tentativa) {

    let certosLugar = 0;

    let certosFora = 0;


    for (let i = 0; i < 4; i++) {

        /*
         * Primeiro verifica se o número
         * está exatamente na posição correta.
         */

        if (tentativa[i] === senha[i]) {

            certosLugar++;

        }

        /*
         * Se não estiver na posição correta,
         * verifica se o número existe na senha.
         */

        else if (senha.includes(tentativa[i])) {

            certosFora++;

        }

    }


    return {

        certosLugar: certosLugar,

        certosFora: certosFora

    };

}


/* ==================================================
   CONFIRMAR CHUTE
================================================== */

function confirmarChute() {

    /*
     * Não permite enviar menos de
     * quatro números.
     */

    if (chute.length !== 4) {

        document
            .getElementById("chuteMensagem")
            .innerText =
            "Digite 4 números.";

        return;

    }


    /*
     * Conta a tentativa.
     */

    tentativas++;


    /*
     * Calcula o resultado.
     */

    let resultado =
        calcularResultado(
            senha,
            chute
        );


    /*
     * Adiciona ao histórico.
     */

    adicionarHistorico(
        chute,
        resultado
    );


    /*
     * Se os quatro estiverem
     * na posição correta,
     * o jogador venceu.
     */

    if (
        resultado.certosLugar === 4
    ) {

        vencer();

        return;

    }


    /*
     * Limpa o chute atual.
     */

    chute = "";


    atualizarChute();


    /*
     * IMPORTANTE:
     *
     * Cada nova tentativa recebe
     * um novo período de 30 segundos.
     */

    iniciarCronometro();

}


/* ==================================================
   HISTÓRICO
================================================== */

function adicionarHistorico(
    numero,
    resultado
) {

    let historico =
        document.getElementById(
            "historico"
        );


    /*
     * Remove a mensagem
     * "Nenhuma tentativa ainda"
     * na primeira tentativa.
     */

    if (tentativas === 1) {

        historico.innerHTML = "";

    }


    let item =
        document.createElement(
            "div"
        );


    item.className =
        "history-item";


    item.innerHTML = `

        <div class="history-guess">
            ${numero}
        </div>

        <div class="result">

            <span class="green">
                🟢 ${resultado.certosLugar}
                certo(s) no lugar
            </span>

            <br>

            <span class="yellow">
                🟡 ${resultado.certosFora}
                certo(s) fora do lugar
            </span>

        </div>

    `;


    /*
     * Coloca a tentativa mais recente
     * no topo.
     */

    historico.prepend(item);

}


/* ==================================================
   CRONÔMETRO
================================================== */

function iniciarCronometro() {

    /*
     * Para qualquer cronômetro anterior.
     */

    clearInterval(intervalo);


    /*
     * Cada tentativa começa
     * novamente com 30 segundos.
     */

    tempo = 30;


    atualizarTimer();


    /*
     * Começa a contagem.
     */

    intervalo =
        setInterval(function() {

            tempo--;


            atualizarTimer();


            /*
             * Quando chega a zero:
             */

            if (tempo <= 0) {

                clearInterval(intervalo);


                /*
                 * A tentativa atual é perdida.
                 */

                chute = "";


                atualizarChute();


                /*
                 * Informa ao jogador.
                 */

                document
                    .getElementById(
                        "chuteMensagem"
                    )
                    .innerText =
                    "⏰ Tempo esgotado! " +
                    "Você perdeu esta tentativa.";


                /*
                 * Inicia automaticamente
                 * uma nova tentativa com
                 * mais 30 segundos.
                 */

                setTimeout(function() {

                    document
                        .getElementById(
                            "chuteMensagem"
                        )
                        .innerText =
                        "Nova tentativa! Você tem 30 segundos.";

                    iniciarCronometro();

                }, 1000);

            }

        }, 1000);

}


/* ==================================================
   ATUALIZAR TIMER
================================================== */

function atualizarTimer() {

    let timer =
        document.getElementById(
            "timer"
        );


    timer.innerText =
        tempo;


    /*
     * Remove estados anteriores.
     */

    timer.classList.remove(
        "warning",
        "danger"
    );


    /*
     * Menos de 10 segundos:
     * fica vermelho.
     */

    if (tempo <= 10) {

        timer.classList.add(
            "danger"
        );

    }

    /*
     * Entre 11 e 15 segundos:
     * fica amarelo.
     */

    else if (tempo <= 15) {

        timer.classList.add(
            "warning"
        );

    }

}


/* ==================================================
   VITÓRIA
================================================== */

function vencer() {

    clearInterval(intervalo);


    esconderTodas();


    document
        .getElementById("winScreen")
        .classList
        .remove("hidden");


    document
        .getElementById("winMessage")
        .innerText =
        "Você descobriu a senha em " +
        tentativas +
        " tentativa(s)!";

}


/* ==================================================
   JOGAR NOVAMENTE
================================================== */

function novoJogo() {

    clearInterval(intervalo);


    senha = "";

    chute = "";

    tentativas = 0;

    tempo = 30;


    iniciarCriacaoSenha();

}


/* ==================================================
   VOLTAR AO INÍCIO
================================================== */

function voltarInicio() {

    clearInterval(intervalo);


    esconderTodas();


    document
        .getElementById("home")
        .classList
        .remove("hidden");

}

</script>
